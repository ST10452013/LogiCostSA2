# LogiCost SA Android app - Azure Pipelines
# Runs the unit tests and builds the debug APK, the same checks as
# the GitHub Actions workflow, so both DevOps tools report on the app.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - LogiCostApp3/*

pool:
  vmImage: ubuntu-latest

steps:
  - script: chmod +x gradlew
    workingDirectory: LogiCostApp3
    displayName: 'Make Gradle wrapper executable'

  - task: Gradle@3
    displayName: 'Run unit tests and build APK'
    inputs:
      workingDirectory: 'LogiCostApp3'
      gradleWrapperFile: 'LogiCostApp3/gradlew'
      tasks: 'testDebugUnitTest assembleDebug'
      publishJUnitResults: true
      testResultsFiles: '**/test-results/testDebugUnitTest/TEST-*.xml'
      # Hosted Ubuntu agents ship JDK 21 at this path.
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME_21_X64)'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish debug APK'
    inputs:
      PathtoPublish: 'LogiCostApp3/app/build/outputs/apk/debug'
      ArtifactName: 'android-apk'
